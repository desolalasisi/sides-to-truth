<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sides To Truth — Memory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', 'Consolas', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px 60px;
  }
  .title {
    font-size: clamp(28px, 8vw, 56px);
    letter-spacing: 0.2em;
    font-weight: 700;
    text-align: center;
    border: 2px solid #fff;
    padding: 18px 24px;
    margin-bottom: 18px;
    width: 100%;
    max-width: 640px;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.5em;
    color: #fff;
    margin-bottom: 28px;
    text-align: center;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-bottom: 24px;
    text-align: center;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #999;
    margin-top: 4px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 560px;
  }
  .tile {
    aspect-ratio: 3/4;
    position: relative;
    cursor: pointer;
    perspective: 1000px;
  }
  .tile-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s;
    transform-style: preserve-3d;
  }
  .tile.flipped .tile-inner,
  .tile.matched .tile-inner {
    transform: rotateY(180deg);
  }
  .tile-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 4px;
    overflow: hidden;
  }
  .tile-back {
    background: #000;
    border: 1px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile-back svg {
    width: 40%;
    height: 40%;
    stroke: #fff;
    stroke-width: 1.5;
    fill: none;
  }
  .tile-front {
    transform: rotateY(180deg);
    border: 1px solid #fff;
  }
  .tile-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tile.matched .tile-front img {
    opacity: 0.45;
  }
  .tile.matched .tile-front {
    border-color: #fff;
    box-shadow: inset 0 0 0 2px #fff;
  }
  .controls {
    margin-top: 28px;
    text-align: center;
  }
  button {
    background: transparent;
    border: 1px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.3em;
    padding: 10px 28px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover {
    background: #fff;
    color: #000;
  }
  .win-message {
    margin-top: 20px;
    font-size: 14px;
    letter-spacing: 0.3em;
    text-align: center;
    min-height: 18px;
  }
</style>
</head>

      <div class="stat-label">TIME</div>

  </div>

  <div class="board" id="board"></div>

  ];

  let deck = [];
  let flipped = [];
  let matched = new Set();
  let moves = 0;
  let pairs = 0;
  let lock = false;
  let seconds = 0;
  let timerInterval = null;
  let started = false;

  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const timerEl = document.getElementById('timer');
  const winMessage = document.getElementById('winMessage');

  const backSVG = `<svg viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="32" height="42" rx="2"/><line x1="17" y1="1" x2="17" y2="43"/><line x1="1" y1="22" x2="33" y2="22"/></svg>`;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildDeck() {
    const pairsArr = [];
    artworks.forEach((art, i) => {
      pairsArr.push({ ...art, pairId: i });
      pairsArr.push({ ...art, pairId: i });
    });
    return shuffle(pairsArr);
  }

  function render() {
    board.innerHTML = '';
    deck.forEach((card, idx) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (flipped.includes(idx)) tile.classList.add('flipped');
      if (matched.has(idx)) tile.classList.add('matched');

      tile.innerHTML = `
        <div class="tile-inner">
          <div class="tile-face tile-back">${backSVG}</div>
          <div class="tile-face tile-front">
            <img src="${card.src}" alt="${card.name}" draggable="false">
          </div>
        </div>
      `;

      if (!matched.has(idx)) {
        tile.addEventListener('click', () => flip(idx));
      }
      board.appendChild(tile);
    });
  }

  function startTimer() {
    if (timerInterval || started) return;
    started = true;
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      timerEl.textContent = m + ':' + String(s).padStart(2, '0');
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function flip(idx) {
    if (lock) return;
    if (flipped.includes(idx) || matched.has(idx)) return;

    startTimer();
    flipped.push(idx);
    render();

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      lock = true;

      const [a, b] = flipped;
      if (deck[a].pairId === deck[b].pairId) {
        setTimeout(() => {
          matched.add(a);
          matched.add(b);
          pairs++;
          pairsEl.textContent = pairs + '/' + artworks.length;
          flipped = [];
          lock = false;
          render();

          if (pairs === artworks.length) {
            stopTimer();
            winMessage.textContent = 'COMPLETE — ' + moves + ' MOVES, ' + timerEl.textContent;
          }
        }, 500);
      } else {
        setTimeout(() => {
          flipped = [];
          lock = false;
          render();
        }, 800);
      }
    }
  }

  function resetGame() {
    stopTimer();
    deck = buildDeck();
    flipped = [];
    matched = new Set();
    moves = 0;
    pairs = 0;
    lock = false;
    seconds = 0;
    started = false;
    movesEl.textContent = '0';
    pairsEl.textContent = '0/' + artworks.length;
    timerEl.textContent = '0:00';
    winMessage.textContent = '';
    render();
  }

  document.getElementById('resetBtn').addEventListener('click', resetGame);

  resetGame();
</script>
